name: Lighthouse report (утренний)

on:
  schedule:
    - cron: "0 6 * * *"      # 09:00 по Москве (UTC+3)
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL для проверки"
        required: false
        default: "https://ai-for-developers-project-387-production-79c6.up.railway.app"

permissions:
  id-token: write
  contents: write
  issues: write

jobs:
  lighthouse-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Run Lighthouse CLI
        run: |
          npx lighthouse "${{ inputs.target_url || 'https://ai-for-developers-project-387-production-79c6.up.railway.app' }}" \
            --output=json --output-path=./lighthouse-report.json \
            --chrome-flags="--headless" --quiet

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: |
            lighthouse-report.json
          retention-days: 30

      - name: Configure git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode (анализ + обновление issue)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Прочитай ./lighthouse-report.json.
            Сравни LCP, CLS, INP, TBT с базовой линией из docs/performance-baseline.md.
            Найди единственный постоянный issue «Утренний отчёт Lighthouse (производительность)» (label performance).
            Если есть — обнови его body: свежие метрики, дата, сравнение с прошлым прогоном.
            Если нет — создай.
            В body держи чеклист правок с конкретными рекомендациями, ссылаясь на docs/dev-plan.md.
            Ничего не коммить, не пуши, не создавай веток и PR. Только обнови или создай указанный issue.
