name: opencode-fix

on:
  issue_comment:
    types: [created]

jobs:
  opencode-fix:
    if: |
      (github.event.issue.pull_request == null) &&
      github.event.comment.user.type != 'Bot' &&
      github.actor != 'github-actions[bot]' &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install commit-msg hook (Conventional Commits)
        run: |
          git config core.hooksPath .githooks
          chmod +x .githooks/commit-msg

      - name: Run opencode (fix)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Перед коммитами соблюдай строгий формат Conventional Commits (на русском):
            - Тип из списка: feat|fix|docs|chore|refactor|test|ci|style|perf|build|revert.
            - Разбивай изменения на логичные коммиты, каждый — со своим типом по его содержимому.
            - Для ломающих изменений в main.tsp (изменение/удаление эндпоинтов или полей) используй feat!.
            - Заголовок ≤100 символов, без точки в конце. Строгий Conventional Commits обязателен.
