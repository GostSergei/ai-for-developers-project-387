name: opencode-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: github.event.issue.user.type != 'Bot' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Run opencode (triage)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Analyze this issue and leave a comment with your assessment:
            - Summary of the problem
            - Affected components (files, modules, services)
            - Likely causes based on the description and discussion
            - Related context, if other issues or PRs are mentioned
            Do NOT create issues or pull requests, do not modify code, and do not comment in other threads.
